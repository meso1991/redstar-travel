<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة دفع ريد ستار - RedStar Payment</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .payment-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .bankak-logo { width: 150px; margin-bottom: 20px; }
        .amount { font-size: 24px; color: #e74c3c; font-weight: bold; margin: 20px 0; }
        .btn-confirm { background-color: #2ecc71; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="payment-card" id="paymentBox">
        <h2>إتمام الدفع عبر بنكك</h2>
        <p>الرجاء تحويل المبلغ إلى حساب وكالة ريد ستار</p>
        <div class="amount">إجمالي: 750,000 SDG</div>
        <input type="text" placeholder="أدخل رقم المرجع (Reference Number)" style="width: 90%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <div class="loader" id="loader"></div>
        <button class="btn-confirm" onclick="processPayment()">تأكيد عملية التحويل</button>
    </div>

    <script>
        function processPayment() {
            document.getElementById('loader').style.display = 'block';
            document.querySelector('.btn-confirm').disabled = true;
            setTimeout(() => {
                document.getElementById('paymentBox').innerHTML = `
                    <h2 style="color: #2ecc71;">✅ تم الحجز بنجاح</h2>
                    <p>رقم التذكرة: <strong>RS-789-2026</strong></p>
                    <p>سيتم إرسال التذكرة إلى بريدك الإلكتروني فوراً.</p>
                    <button onclick="window.location.href='index.html'" style="margin-top:20px; padding:10px; cursor:pointer;">العودة للرئيسية</button>
                `;
            }, 3000);
        }
    </script>
</body>
</html>
